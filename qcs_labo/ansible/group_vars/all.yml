# =============================================================
# QCS デモ環境 共通変数（パラメータ定義）
# -------------------------------------------------------------
# このファイルが「設定値の唯一のソース(single source of truth)」です。
# Ansible の適用値も、Excel パラメータシートも、この値から生成されます。
# 環境に合わせてここを編集してください。
# =============================================================

# -------------------------------------------------------------
# 1) ユーザー登録
# -------------------------------------------------------------
# 追加するユーザーの一覧。
#   name         : ユーザー名
#   comment      : GECOS（説明）
#   groups       : 追加所属グループ（sudo 用に wheel を付与）
#   sudo         : sudo を許可するか
#   sudo_policy  : 'A' = ブロックリスト方式（su 等を禁止）
#                  'B' = ホワイトリスト方式（許可コマンドのみ）
#   ssh_keys     : 登録する SSH 公開鍵のリスト（空なら登録なし）
#   shell        : ログインシェル
#   set_initial_password : true の場合、共通初期パスワード（実行時に
#                  -e "demo_user_password=..." で渡す）を設定し、
#                  初回ログイン時にパスワード変更を強制する。
#                  ※ 平文はリポジトリに置かない運用（Public リポジトリ対策）。
users:
  - name: qcsdemo
    comment: "QCS demo login user (restricted)"
    groups: ["wheel"]
    sudo: true
    sudo_policy: "A"        # 現在は方針A。将来 'B' に切り替え予定（デモログイン用のため要見直し）
    ssh_keys: []            # 例: ["ssh-ed25519 AAAA... comment"]
    shell: /bin/bash
    set_initial_password: true

  - name: tisiadmin
    comment: "QCS demo administrator"
    groups: ["wheel"]
    sudo: true
    sudo_policy: "unrestricted"   # 制限なし（フル sudo）
    ssh_keys: []
    shell: /bin/bash
    set_initial_password: true

# -------------------------------------------------------------
# sudo 方針の定義（方針A / 方針B の切り替えはユーザーの sudo_policy で行う）
# -------------------------------------------------------------
sudo_policies:
  # 方針A: ブロックリスト方式。
  #   フル sudo を許可しつつ、以下のコマンドだけを明示的に禁止する。
  #   ※ sudo -i / sudo bash などの抜け道は残るため、あくまでデモ用途向け。
  A:
    denied_commands:
      - /usr/bin/su
      - /bin/su

  # 方針B: ホワイトリスト方式（将来の厳格運用向け）。
  #   下記コマンドのみ sudo 実行を許可し、それ以外は不可。
  #   移行時はここに qcsdemo が使うコマンドを洗い出して列挙する。
  B:
    allowed_commands:
      - /usr/bin/dnf
      - /usr/bin/systemctl status *
      - /usr/bin/iperf3
      - /usr/bin/fio
      - /usr/bin/stress-ng

# -------------------------------------------------------------
# 2) SELinux
# -------------------------------------------------------------
# state: 'disabled'（永続無効・再起動後も無効） / 'permissive' / 'enforcing'
selinux_state: disabled

# -------------------------------------------------------------
# 3) 導入パッケージ（指定）
# -------------------------------------------------------------
# stress-ng は EPEL が必要なため、EPEL を有効化する。
enable_epel: true
packages:
  - iperf3
  - fio
  - stress-ng

# -------------------------------------------------------------
# 4) OS 最新化
# -------------------------------------------------------------
# os_update: true で全パッケージを最新化（dnf update）。
os_update: true
# 最新化後にカーネル更新等があれば再起動するか。
reboot_if_required: false

# -------------------------------------------------------------
# メタ情報（Excel パラメータシートのヘッダに使用）
# -------------------------------------------------------------
project_meta:
  project_name: "QCS Labo - Rocky Linux 9 デモ環境"
  platform: "QCS (クラウド基盤)"
  os: "Rocky Linux 9"
  author: "TISI"

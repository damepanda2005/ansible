# =============================================================
# QCS デモ環境 インベントリ
# -------------------------------------------------------------
# 踏み台（制御ノード）から、QCS 上の Rocky Linux 9 ノードへ
# SSH 接続する定義です。
#
# 認証方式: admin / パスワード認証（SSH）
#   - SSH パスワードは実行時に -k で入力します（安全のためファイルに書かない）。
#   - sudo はパスワード未設定のため become のパスワード入力（-K）は不要です。
#   - パスワード認証には踏み台に sshpass が必要です。
# =============================================================

[demo]
demo-linux02 ansible_host=172.25.23.93
demo-linux03 ansible_host=172.25.23.94

[demo:vars]
# SSH 接続ユーザー（QCS Rocky Linux の初期ユーザー）
ansible_user=admin
# SSH 接続方式（パスワード認証）
ansible_connection=ssh
# Python インタプリタ（Rocky 9 は python3）
ansible_python_interpreter=/usr/bin/python3
# 初回接続時のホストキー確認を無視（デモ簡略化。ansible.cfg でも無効化済み）
ansible_ssh_common_args=-o StrictHostKeyChecking=no

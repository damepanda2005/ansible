[defaults]
# インベントリの既定パス
inventory = inventory/hosts.ini
# ロールの探索パス
roles_path = roles
# ホストキー確認をデモ簡略化のため無効化（本番では要検討）
host_key_checking = False
# 実行時の見やすい出力
stdout_callback = yaml
# リトライファイルを作らない
retry_files_enabled = False
# 接続時のSSHユーザー既定（inventory/group_varsで上書き可能）
remote_user = admin
# ファクト収集のスマート化
gathering = smart
# タイムアウト
timeout = 30

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
# 高速化のためのパイプライン
pipelining = True
# 接続の多重化
control_path = /tmp/ansible-ssh-%%h-%%p-%%r

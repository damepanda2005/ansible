---
# =============================================================
# QCS Labo - サーバ構成情報収集プレイブック
# -------------------------------------------------------------
# 対象サーバのファクトを収集し、制御ノード上に Markdown レポートを
# 出力します（構築用の site.yml とは独立して実行可能）。
#
# 実行例（踏み台 = 制御ノードで）:
#   ansible-playbook gather_info.yml
#   # 出力: docs/reports/<ホスト名>_構成情報.md
#
# ※ 情報収集のみのため become は不要（読み取り中心）。
#    一部コマンドで権限が必要なら --become を付けて実行してください。
# =============================================================

- name: サーバ構成情報の収集とレポート生成
  hosts: demo
  gather_facts: true
  become: false

  roles:
    - role: gather_info
      tags: ["gather_info", "report"]
